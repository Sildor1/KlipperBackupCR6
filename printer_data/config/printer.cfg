# This file contains pin mappings for the Creality CR6-SE with Rev. 4.5.3 Motherboard (Late 2020/2021) as the heater pins changed.
# To use this config, during "make menuconfig" select the STM32F103
# with a "28KiB bootloader" and serial (on USART1 PA10/PA9)
# communication.

# Flash this firmware by copying "out/klipper.bin" to a SD card and
# turning on the printer with the card inserted. The firmware
# filename must end in ".bin" and must not match the last filename
# that was flashed.

# See docs/Config_Reference.md for a description of parameters.

# Creality CR-6 SE specific configuration
# The START_PRINT and END_PRINT macro's are called in the slicer start code
# Slicer start code:	start_print HOTEND_TEMP={material_print_temperature_layer_0} BED_TEMP={material_bed_temperature_layer_0}
# Slicer end code:		end_print
# The end_print sets the part fan to maximum to speed up cooling of the hotend and waits for the hotend and bed to cool below 50 °C.
# The end print macro can switch off the printer, this part is commented out as the RPI_MCU needs to be implemneted first.

[include mainsail.cfg]
[include macros.cfg]
[include timelapse.cfg]
[include shell_command.cfg]
[include KlipperScreen.conf]

#############################################################################################################
# Host
#############################################################################################################

[mcu Pi]
serial: /tmp/klipper_host_mcu

[virtual_sdcard] 
path: /home/klipper/printer_data/gcodes

[sdcard_loop]

#############################################################################################################
# Printer
#############################################################################################################

[printer]
kinematics: cartesian
max_velocity: 350
max_accel: 500
square_corner_velocity: 5
max_z_velocity: 5
max_z_accel: 100

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[heater_bed]
heater_pin: PB13
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PB0
#control: pid
# tuned for stock hardware with 50 degree Celsius target
#pid_Kp: 79.49
#pid_Ki: 1.17
#pid_Kd: 1349.52
min_temp: 0
max_temp: 120


#############################################################################################################
# Printer Features
#############################################################################################################

[pause_resume]

[display_status]

[gcode_arcs]
resolution: 0.5

[idle_timeout]
gcode:
  {% if printer.pause_resume.is_paused %}
    M104 S0
    RESPOND TYPE=error MSG="No operations in 1h! Turning nozzle off, leaving bed & motors on. Print is paused."
  {% else %}
    RESPOND TYPE=echo MSG="No operations in 1h! Turning off heaters and motors, except Z-motor."
    TURN_OFF_HEATERS
    SET_PIN PIN=my_led VALUE=0.01
    M84 X Y E 
  {% endif %}
timeout: 3600

[respond]
#default_type: echo
#   Sets the default prefix of the "M118" and "RESPOND" output to one
#   of the following:
#       echo: "echo: " (This is the default)
#       command: "// "
#       error: "error!"
#default_prefix: echo:
#   Directly sets the default prefix. If present, this value will
#   override the "default_type".

[force_move]
enable_force_move: True


#############################################################################################################
# Stepper,A4988
#############################################################################################################

[stepper_x]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PC3
rotation_distance: 40
microsteps: 16
endstop_pin: PC4
position_min: -5
position_endstop: -5
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PB6
dir_pin: PB5
enable_pin: !PC3
rotation_distance: 40
microsteps: 16
endstop_pin: PC5
position_min: -2
position_endstop: -2
position_max: 235
homing_speed: 50

[stepper_z]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PC3
rotation_distance: 8
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 250
homing_speed: 4
second_homing_speed: 0.3
homing_retract_dist: 2.0

[extruder]
max_extrude_only_distance: 1000.0
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 23.3228
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB14
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PB1
control: pid
pid_Kp: 14.32
pid_Ki: 0.81
pid_Kd: 63.12
min_temp: 0
max_temp: 275


#############################################################################################################
# Bed Meshing
#############################################################################################################

# Before printing the PROBE_CALIBRATE command needs to be issued
# to run the probe calibration procedure, described at
# docs/Probe_Calibrate.md, to find the correct z_offset.
[probe]
pin: PA4
x_offset: 0.0
y_offset: 0.0
#z_offset: -0.25
speed: 3
sample_retract_dist: 3
lift_speed: 10
samples_result: median
samples_tolerance: 0.100
samples_tolerance_retries: 1
activate_gcode:
	PROBE_RESET
    #TARE_PROBE

[bed_mesh]
speed: 200
horizontal_move_z: 5
mesh_min: 5,5
mesh_max: 230,230
probe_count: 13,13
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0
mesh_pps: 4,4

[safe_z_home]
home_xy_position: 117.5,117.5
speed: 100
z_hop: 10
z_hop_speed: 10


#############################################################################################################
# Adjust Bed Screws
#############################################################################################################

[screws_tilt_adjust]
screw1: -1, 45
screw1_name: front left screw
screw2: 168, 45
screw2_name: front right screw
screw3: 168, 215
screw3_name: rear right screw
screw4: -1, 215
screw4_name: rear left screw
horizontal_move_z: 5
speed: 200
screw_thread: CW-M4

#############################################################################################################
# Fans
#############################################################################################################

[fan]
pin: PB15
kick_start_time: 0.5

[temperature_sensor RPi]
sensor_type: temperature_host

[temperature_sensor MCU]
sensor_type: temperature_mcu


#############################################################################################################
# Miscellanious
#############################################################################################################

[exclude_object]

[gcode_macro PROBE_RESET]
gcode:
	{action_respond_info("Reset")}
    G4 P1000
	{action_respond_info("Start")}

#[output_pin probe_tare]
#pin: !PA5
#value: 1

[output_pin probe_enable]
pin: PB2

[filament_switch_sensor filament_sensor]
pause_on_runout: true
switch_pin: ^!PA7

[output_pin LED_pin]
pin: PA6

[static_digital_output daughterboard_communication]
pins: !PA5

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 35.0
shaper_type_y: mzv
shaper_freq_y: 35.0


